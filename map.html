:root {
  --ink: #3B3355; --body: #5A5070; --cream: #FFF7EE; --lav: #F4EFFB;
  --coral: #B4503A; --peach: #FFE6DC; --mint: #DFF4EA; --butter: #FFF2CC; --lilac: #EEE6FC;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--cream); color: var(--body);
  font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.app { display: flex; flex-direction: column; height: 100%; padding: 18px 22px 22px; gap: 14px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
h1 { font-family: 'Jua', sans-serif; font-weight: 400; color: var(--ink); font-size: 30px; margin: 0; }
.sub { font-size: 15px; color: #6E6585; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font-family: 'Jua', sans-serif; font-size: 17px; border: 0; cursor: pointer; padding: 8px 16px;
  border-radius: 999px; background: #FFFDF9; color: var(--ink); box-shadow: 0 4px 0 #EFE3D3; transition: transform .15s; }
.tab:hover { transform: translateY(-2px); }
.tab[aria-selected="true"] { background: var(--dc, #FFC2B0); box-shadow: 0 4px 0 var(--ds, #E8A48F); }
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; min-height: 0; }
#map { border-radius: 28px; overflow: hidden; background: #DCEBF2; box-shadow: 0 8px 0 #EADFD0; min-height: 300px; }
.panel { background: #FFFDF9; border-radius: 28px; box-shadow: 0 8px 0 #EFE3D3; padding: 20px 20px 16px;
  overflow-y: auto; min-height: 0; }
.dayhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.dayhead h2 { font-family: 'Jua', sans-serif; font-weight: 400; color: var(--ink); font-size: 23px; margin: 0; }
.dayhead { flex-wrap: wrap; }
.city { white-space: nowrap; font-size: 14px; color: var(--coral); background: var(--peach); padding: 2px 12px; border-radius: 999px; }
.hint { font-size: 13.5px; color: #6E6585; margin: 6px 0 14px; line-height: 1.5; }
ol.stops { list-style: none; margin: 0; padding: 0; }
.stop { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 10px 8px; border-radius: 18px; cursor: pointer; }
.stop:hover, .stop.active { background: var(--lav); }
.badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: 'Jua', sans-serif; font-size: 17px; color: var(--ink); border: 2px solid var(--ink); }
.sname { font-family: 'Jua', sans-serif; font-size: 18px; color: var(--ink); }
.when { font-size: 12.5px; color: var(--coral); margin-left: 6px; }
.zh { font-size: 14px; color: #6E6585; }
.note { font-size: 14px; line-height: 1.45; margin-top: 2px; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.btn { font-family: inherit; font-size: 13px; text-decoration: none; color: var(--ink); background: var(--butter);
  border: 0; border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.btn.alt { background: var(--mint); }
.leg { margin: 0 0 0 26px; padding: 4px 0 4px 22px; border-left: 3px dashed #D9CDEB; font-size: 13.5px; color: #6E6585; }
.leg a { color: #3E6FA8; }
.foot { font-size: 12.5px; color: #7A7190; line-height: 1.5; margin-top: 14px; border-top: 1px dashed #E6DCCD; padding-top: 10px; }
.overview .card { background: var(--lav); border-radius: 18px; padding: 10px 14px; margin-bottom: 10px; cursor: pointer; }
.overview .card b { font-family: 'Jua', sans-serif; font-weight: 400; color: var(--ink); font-size: 18px; }
.pin { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #3B3355; display: flex; align-items: center;
  justify-content: center; font-family: 'Jua', sans-serif; font-size: 15px; color: #3B3355; box-shadow: 0 3px 0 rgba(59,51,85,.25); }
.pin.big { width: 38px; height: 38px; font-size: 18px; }
.leaflet-tooltip.lbl { font-family: 'Jua', sans-serif; font-size: 13px; color: #3B3355; background: #FFFDF9;
  border: 0; border-radius: 999px; padding: 3px 10px; box-shadow: 0 3px 0 #EADFD0; }
.leaflet-tooltip.lbl::before { display: none; }
.nolbl .leaflet-tooltip.perm { display: none; }
.zooms { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.citylbl { font-family: 'Jua', sans-serif; font-size: 20px; color: #A0937F; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #FFF7EE;
  padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.leaflet-tile-pane { filter: saturate(0.55) sepia(0.12) brightness(1.03); }
.leaflet-control-attribution { font-size: 11px; }
body.shot .app { padding: 0; gap: 0; height: 100%; }
body.shot header, body.shot .tabs, body.shot .panel, body.shot .leaflet-control-zoom, body.shot .leaflet-control-attribution { display: none; }
body.shot .main { grid-template-columns: 1fr; }
body.embed .leaflet-control-zoom, body.embed .leaflet-control-attribution { display: block; }
body.shot #map { border-radius: 0; box-shadow: none; height: 100%; }
@media (max-width: 860px) {
  .app { height: auto; padding: 14px; }
  .main { grid-template-columns: 1fr; }
  #map { height: 52vh; }
  .panel { overflow: visible; }
}
</style>
</head>

    <span class="sub">날짜를 누르면 그날 동선이 보여요. 장소 이름 옆 버튼은 가오더 지도로 열려요.</span>

  <div class="main">

    <aside class="panel" id="panel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

    const pick = cands.find(c => !hit(c[2])) || cands[0];
    pts[i] = own; boxes.push(pick[2]);
    const m = L.marker([s.pos[1], s.pos[0]], { icon: pinIcon(i + 1, c.fill, true), zIndexOffset: 100 + i })
      .bindTooltip(esc(s.ko), { className: 'lbl perm', direction: pick[0], offset: pick[1], permanent: true })
      .on('click', () => focusStop(i));
    m.addTo(dayLayer); markers.push(m);
  });
  lblToggle();
  const areas = [...new Set(d.stops.map(area))];

  const p = document.getElementById('panel');
  p.className = 'panel';
  let html = '<div class="dayhead"><h2>' + n + '일차 · ' + esc(d.title) + '</h2><span class="city">' + esc(d.city) + '</span></div>' +
    (areas.length > 1 ? '<div class="zooms">' + areas.map(a => '<button class="btn alt" data-area="' + a + '">' + a + ' 확대</button>').join('') + '<button class="btn" data-area="*">하루 전체</button></div>' : '') +
    '<p class="hint">장소를 누르면 지도가 그곳으로 가요. 실선은 차도, 점선은 걷는 길, 긴 점선은 고속철·비행기예요. 실제 시간은 가오더 길찾기에서 확인해요.</p><ol class="stops">';
  d.stops.forEach((s, i) => {
    html += '<li class="stop" data-i="' + i + '">' +
      '<div class="badge" style="background:' + c.fill + '">' + (i + 1) + '</div>' +
      '<div><div><span class="sname">' + esc(s.ko) + '</span><span class="when">' + esc(s.when) + '</span></div>' +
      '<div class="zh">' + esc(s.zh) + '</div>' +
      '<div class="note">' + esc(s.note) + '</div>' +
      (s.abroad ? '' : '<div class="acts"><a class="btn" href="' + amapMarker(s) + '" target="_blank" rel="noopener">가오더에서 보기</a>' +
      '<button class="btn alt" data-copy="' + esc(s.zh) + '">중국어 이름 복사</button></div>') + '</div></li>';
    if (i < d.stops.length - 1) {
      const nx = d.stops[i + 1], mode = MODE[d.legs[i]], r = d.routes[i];
      let info;
      if (r) {
        const mins = Math.max(1, Math.round(r.dur / 60));
        info = d.legs[i] === 'walk' ? '도로 거리 ' + fmtKm(r.dist / 1000) + ' · 걸어서 약 ' + mins + '분'
          : '도로 거리 ' + fmtKm(r.dist / 1000) + ' · 차로 약 ' + mins + '분(막히지 않을 때)' + (d.legs[i] === 'bus' ? ' · 선은 차도 기준' : '');
      } else {
        info = '직선 거리 ' + fmtKm(km(s.pos, nx.pos));
      }
      html += '<li class="leg">' + mode.ko + ' · ' + info +
        (mode.amap ? ' · <a href="' + amapNav(s, nx, mode.amap) + '" target="_blank" rel="noopener">가오더 길찾기</a>'
                   : (d.legs[i] === 'train' ? ' · 트립닷컴이나 12306에서 예매' : '')) + '</li>';
    }
  });
  html += '</ol>' + footHtml();
  p.innerHTML = html;
  p.querySelectorAll('.stop').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('a,button')) return;
    focusStop(+el.dataset.i);
  }));
  p.querySelectorAll('[data-area]').forEach(b => b.addEventListener('click', () => {
    const pts = d.stops.filter(s => b.dataset.area === '*' || area(s) === b.dataset.area).map(s => [s.pos[1], s.pos[0]]);
    map.fitBounds(L.latLngBounds(pts), { padding: [70, 70], maxZoom: 15 });
  }));
  p.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(b.dataset.copy); toast('복사했어요: ' + b.dataset.copy); }
    catch (err) { toast('복사가 막혀 있어요. 이름을 길게 눌러 복사해 주세요.'); }
  }));
}

function focusStop(i) {
  const m = markers[i]; if (!m) return;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 15), { animate: true });
  document.querySelectorAll('.stop').forEach(el => el.classList.toggle('active', +el.dataset.i === i));
  const el = document.querySelector('.stop[data-i="' + i + '"]');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function footHtml() {
  return '<div class="foot">장소 좌표는 오픈스트리트맵에서 찾은 값이에요(가오더 링크에는 가오더 좌표계로 바꿔 넣었어요). 원산 디지털 생활 지구는 문삼로 기준의 대략 위치예요. ' +
    '도로 경로는 OSRM(routing.openstreetmap.de)으로 계산했어요. 호텔은 아직 정하지 않아 동선에 넣지 않았어요. ' +
    DATA.tiles.note + '</div>';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const items = [{ n: 0, label: '전체' }].concat(DATA.days.map(d => ({ n: d.n, label: d.n + '일차' })));
  tabs.innerHTML = items.map(t => {
    const c = COLORS[t.n];
    const style = c ? ' style="--dc:' + c.fill + ';--ds:' + c.shadow + '"' : '';
    return '<button class="tab" data-n="' + t.n + '"' + style + '>' + t.label + '</button>';
  }).join('');
  tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => select(+b.dataset.n)));
}

function select(n) {
  const h = n ? '#day-' + n : '#all';
  if (location.hash !== h) { location.hash = h; return; }
  route();
}
function route() {
  const m = /^#day-(\d)$/.exec(location.hash);
  const n = m ? +m[1] : 0;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.n === n)));
  n ? showDay(n) : showOverview();
  setTimeout(() => map.invalidateSize(), 50);
}
window.addEventListener('hashchange', route);
renderTabs();
route();
</script>
</body>
</html>
